<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 546 546" width="546" height="546">
<!--
  Digitale Vaardigheden Lingo — assets/rand.svg

  De sierrand rondom het speelveld, opgebouwd uit iconen die met digitale
  vaardigheden te maken hebben: wifi, muis, map, cursor, slot, wolk,
  toetsenbord, scherm, zoeken, apenstaartje, usb en chat.

  Dit bestand wordt door css/rand.css als border-image gebruikt. Daarom is het
  opgezet als negenvlak: de vier hoeken zijn 78x78, de randen ertussen zijn
  390 breed en herhalen zich. Het midden blijft leeg, want daar zit het spel.
  De hoekmaat 78 staat ook in css/rand.css als border-image-slice; verander je
  hier het raster, verander hem daar mee.

  In elk randstuk staan drie tegeltjes, op 143, 273 en 403. Dat verdeelt het
  strookje gelijkmatig en sluit naadloos aan op de volgende herhaling: overal
  130 uit elkaar, ook over de naad heen. Vijf tegeltjes stonden hier eerder en
  dat werd een dichte strook confetti; met drie krijgt elk icoon lucht en zie
  je wát er staat in plaats van dat er iets staat.

  Elk icoon zit op een afgerond tegeltje in de kleuren van Lingo, met een
  donkere onderrand zodat het net als de tegels op het bord diepte heeft.
-->

<defs>
  <!-- ==== De glyphs. Wit, dikke lijnen, zodat ze klein leesbaar blijven.
       De schaal van 1.18 staat op de tekening zelf en niet op elke <use>,
       zodat een icoon wisselen één regel blijft. ==== -->
  <g id="g-wifi" transform="scale(1.30)"
     stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M-16-6a23 23 0 0 1 32 0"/>
    <path d="M-9 2a13 13 0 0 1 18 0"/>
    <circle cx="0" cy="10" r="3" fill="#fff" stroke="none"/>
  </g>

  <g id="g-muis" transform="scale(1.30)">
    <rect x="-11" y="-16" width="22" height="32" rx="11" fill="none" stroke="#fff" stroke-width="5"/>
    <path d="M0-10v7" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g id="g-map" transform="scale(1.30)">
    <path d="M-17-12h11l4 5h19a3 3 0 0 1 3 3v16a3 3 0 0 1-3 3h-34a3 3 0 0 1-3-3v-21a3 3 0 0 1 3-3z"
          fill="#fff"/>
  </g>

  <g id="g-cursor" transform="scale(1.30)">
    <path d="M-9-16 12 2 3 3l5 11-5 2-5-11-7 6z" fill="#fff"/>
  </g>

  <g id="g-slot" transform="scale(1.30)">
    <path d="M-9-4v-6a9 9 0 0 1 18 0v6" fill="none" stroke="#fff" stroke-width="5"/>
    <rect x="-13" y="-4" width="26" height="20" rx="4" fill="#fff"/>
  </g>

  <g id="g-wolk" transform="scale(1.30)">
    <path d="M-14 10a9 9 0 0 1 1-18 12 12 0 0 1 23-3 9 9 0 0 1 2 21z" fill="#fff"/>
  </g>

  <g id="g-toetsenbord" transform="scale(1.30)">
    <rect x="-18" y="-11" width="36" height="23" rx="4" fill="none" stroke="#fff" stroke-width="4"/>
    <g fill="#fff">
      <rect x="-13" y="-6" width="5" height="5" rx="1"/>
      <rect x="-4" y="-6" width="5" height="5" rx="1"/>
      <rect x="5" y="-6" width="5" height="5" rx="1"/>
      <rect x="-9" y="3" width="18" height="4" rx="2"/>
      <rect x="-13" y="3" width="2" height="4" rx="1"/>
    </g>
  </g>

  <g id="g-scherm" transform="scale(1.30)">
    <rect x="-17" y="-14" width="34" height="22" rx="3" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M-7 8v6M7 8v6M-11 14h22" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g id="g-zoek" transform="scale(1.30)"
     stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round">
    <circle cx="-3" cy="-3" r="11"/>
    <path d="M6 6l10 10"/>
  </g>

  <g id="g-at" transform="scale(1.30)"
     stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="7"/>
    <path d="M7 0v4a5 5 0 0 0 9 0v-4A16 16 0 1 0 8 14"/>
  </g>

  <!-- Een geheugenstick leest klein beter dan het usb-drietandje. -->
  <g id="g-usb" transform="scale(1.30)">
    <rect x="-16" y="-6" width="22" height="16" rx="3" fill="#fff"/>
    <rect x="6" y="-3" width="10" height="10" rx="1.5" fill="#fff" opacity=".75"/>
    <rect x="-12" y="-2" width="4" height="8" rx="1" fill="currentColor"/>
  </g>

  <g id="g-chat" transform="scale(1.30)">
    <path d="M-16-12h32a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3h-18l-9 8v-8h-5a3 3 0 0 1-3-3v-15a3 3 0 0 1 3-3z"
          fill="#fff"/>
  </g>

  <!-- ==== Het tegeltje waar elk icoon op staat. ==== -->
  <g id="tegel">
    <rect x="-36" y="-32" width="72" height="72" rx="19" fill="#000" opacity=".18"/>
    <rect x="-36" y="-36" width="72" height="72" rx="19" fill="currentColor"/>
    <rect x="-36" y="-36" width="72" height="33" rx="16" fill="#fff" opacity=".16"/>
  </g>
</defs>

<!-- ============================ HOEKEN ============================ -->
<g transform="translate(39,39)"   color="#e8382f"><use href="#tegel"/><use href="#g-wifi"/></g>
<g transform="translate(507,39)"  color="#3ec98a"><use href="#tegel"/><use href="#g-wolk"/></g>
<g transform="translate(39,507)"  color="#ffd23a"><use href="#tegel"/><use href="#g-slot"/></g>
<g transform="translate(507,507)" color="#3f95e2"><use href="#tegel"/><use href="#g-scherm"/></g>

<!-- ===================== BOVENRAND (herhaalt) ===================== -->
<g transform="translate(143,39)" color="#3f95e2"><use href="#tegel"/><use href="#g-muis"/></g>
<g transform="translate(273,39)" color="#ffd23a"><use href="#tegel"/><use href="#g-map"/></g>
<g transform="translate(403,39)" color="#3ec98a"><use href="#tegel"/><use href="#g-cursor"/></g>

<!-- ===================== ONDERRAND (herhaalt) ===================== -->
<g transform="translate(143,507)" color="#3ec98a"><use href="#tegel"/><use href="#g-chat"/></g>
<g transform="translate(273,507)" color="#e8382f"><use href="#tegel"/><use href="#g-toetsenbord"/></g>
<g transform="translate(403,507)" color="#3f95e2"><use href="#tegel"/><use href="#g-usb"/></g>

<!-- ==================== LINKERRAND (herhaalt) ===================== -->
<g transform="translate(39,143)" color="#3f95e2"><use href="#tegel"/><use href="#g-scherm"/></g>
<g transform="translate(39,273)" color="#e8382f"><use href="#tegel"/><use href="#g-muis"/></g>
<g transform="translate(39,403)" color="#ffd23a"><use href="#tegel"/><use href="#g-map"/></g>

<!-- ==================== RECHTERRAND (herhaalt) ==================== -->
<g transform="translate(507,143)" color="#ffd23a"><use href="#tegel"/><use href="#g-zoek"/></g>
<g transform="translate(507,273)" color="#e8382f"><use href="#tegel"/><use href="#g-at"/></g>
<g transform="translate(507,403)" color="#3ec98a"><use href="#tegel"/><use href="#g-cursor"/></g>
</svg>
