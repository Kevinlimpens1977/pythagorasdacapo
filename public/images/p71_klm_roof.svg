<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f8fafc" rx="20"/>
  
  <!-- Triangle KLM -->
  <g transform="translate(50, 50)">
    <path d="M 0 0 L 0 300 L 250 0 Z" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <rect x="0" y="0" width="15" height="15" fill="none" stroke="#16a34a" stroke-width="2"/>
    <text x="-25" y="15" font-family="Inter" font-weight="bold" font-size="24">M</text>
    <text x="-25" y="325" font-family="Inter" font-weight="bold" font-size="24">K</text>
    <text x="260" y="15" font-family="Inter" font-weight="bold" font-size="24">L</text>
    <text x="125" y="360" text-anchor="middle" font-family="Inter" font-size="18" fill="#64748b">Opgave 3a, 3b</text>
  </g>

  <!-- House Roof PQR -->
  <g transform="translate(400, 50)">
    <!-- House base -->
    <rect x="50" y="150" width="300" height="150" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <rect x="175" y="180" width="50" height="70" fill="white" stroke="#dc2626" stroke-width="2"/>
    
    <!-- Roof PQR -->
    <path d="M 0 150 L 200 0 L 400 150 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="4"/>
    <!-- Note: In right triangle context, PQR might be split by altitude, but here it's likely R at the top and 90 degrees at the peak? 
         Wait, book says PQR is a triangle on the roof. Let's look at the image.
         R is at the peak. If it's a right triangle, R is 90. -->
    <rect x="190" y="0" width="20" height="20" fill="none" stroke="#dc2626" stroke-width="2" transform="rotate(45, 200, 10)"/>
    
    <text x="-20" y="175" font-family="Inter" font-weight="bold" font-size="24">P</text>
    <text x="200" y="-15" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="24">R</text>
    <text x="410" y="175" font-family="Inter" font-weight="bold" font-size="24">Q</text>
    <text x="200" y="360" text-anchor="middle" font-family="Inter" font-size="18" fill="#64748b">Opgave 3c, 3d</text>
  </g>
</svg>
