<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="400" fill="#f8fafc" rx="20"/>
  
  <!-- Triangle ABC (Right angle at C) -->
  <g transform="translate(50, 50)">
    <path d="M 0 200 L 200 200 L 100 0 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <rect x="92" y="8" width="16" height="16" fill="none" stroke="#2563eb" stroke-width="2" transform="rotate(26, 100, 0)"/>
    <text x="-20" y="230" font-family="Inter, sans-serif" font-weight="bold" font-size="24">A</text>
    <text x="210" y="230" font-family="Inter, sans-serif" font-weight="bold" font-size="24">B</text>
    <text x="100" y="-10" text-anchor="middle" font-family="Inter, sans-serif" font-weight="bold" font-size="24">C</text>
    <text x="100" y="260" text-anchor="middle" font-family="Inter" font-size="16" fill="#64748b">Δ ABC</text>
  </g>

  <!-- Triangle DEF (Right angle at E) -->
  <g transform="translate(300, 50)">
    <path d="M 0 200 L 200 200 L 200 0 Z" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <rect x="180" y="180" width="20" height="20" fill="none" stroke="#059669" stroke-width="2"/>
    <text x="-20" y="230" font-family="Inter, sans-serif" font-weight="bold" font-size="24">D</text>
    <text x="210" y="230" font-family="Inter, sans-serif" font-weight="bold" font-size="24">E</text>
    <text x="210" y="-10" font-family="Inter, sans-serif" font-weight="bold" font-size="24">F</text>
    <text x="100" y="260" text-anchor="middle" font-family="Inter" font-size="16" fill="#64748b">Δ DEF</text>
  </g>

  <!-- Triangle KLM (Right angle at M) -->
  <g transform="translate(550, 50)">
    <path d="M 0 200 L 250 200 L 0 0 Z" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <rect x="0" y="0" width="20" height="20" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="-20" y="230" font-family="Inter, sans-serif" font-weight="bold" font-size="24">K</text>
    <text x="260" y="230" font-family="Inter, sans-serif" font-weight="bold" font-size="24">L</text>
    <text x="-20" y="-10" font-family="Inter, sans-serif" font-weight="bold" font-size="24">M</text>
    <text x="125" y="260" text-anchor="middle" font-family="Inter" font-size="16" fill="#64748b">Δ KLM</text>
  </g>

  <!-- Triangle PQR (Right angle at P) -->
  <g transform="translate(800, 50)">
    <path d="M 0 200 L 150 200 L 0 0 Z" fill="#fdf2f8" stroke="#db2777" stroke-width="3"/>
    <rect x="0" y="180" width="20" height="20" fill="none" stroke="#db2777" stroke-width="2"/>
    <text x="-20" y="230" font-family="Inter, sans-serif" font-weight="bold" font-size="24">P</text>
    <text x="160" y="230" font-family="Inter, sans-serif" font-weight="bold" font-size="24">Q</text>
    <text x="-20" y="-10" font-family="Inter, sans-serif" font-weight="bold" font-size="24">R</text>
    <text x="75" y="260" text-anchor="middle" font-family="Inter" font-size="16" fill="#64748b">Δ PQR</text>
  </g>
</svg>
