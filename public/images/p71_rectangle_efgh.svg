<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f8fafc" rx="20"/>
  
  <g transform="translate(100, 100)">
    <!-- Rectangle -->
    <rect x="0" y="0" width="400" height="200" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="4"/>
    
    <!-- Diagonal FH -->
    <line x1="0" y1="0" x2="400" y2="200" stroke="#ef4444" stroke-width="4"/>
    
    <!-- Labels -->
    <text x="-30" y="230" font-family="Inter" font-weight="bold" font-size="28">E</text>
    <text x="410" y="230" font-family="Inter" font-weight="bold" font-size="28">F</text>
    <text x="410" y="-10" font-family="Inter" font-weight="bold" font-size="28">G</text>
    <text x="-30" y="-10" font-family="Inter" font-weight="bold" font-size="28">H</text>
    
    <!-- Dimensions -->
    <text x="200" y="240" text-anchor="middle" font-family="Inter" font-size="20" fill="#64748b">5 cm</text>
    <text x="450" y="110" text-anchor="middle" font-family="Inter" font-size="20" fill="#64748b" transform="rotate(90, 450, 110)">2 cm</text>
    
    <!-- Right angle markers -->
    <rect x="0" y="180" width="20" height="20" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="380" y="0" width="20" height="20" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  </g>
  <text x="300" y="370" text-anchor="middle" font-family="Inter" font-size="18" fill="#64748b">Opgave 4: Rechthoek met diagonaal</text>
</svg>
