<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Triangle KLM with right angle at K -->
  <path d="M 100 100 L 100 300 L 350 300 Z" fill="#e0f2fe" stroke="black" stroke-width="3" />
  
  <!-- Right angle square at K (bottom-left) -->
  <rect x="100" y="270" width="30" height="30" fill="none" stroke="black" stroke-width="2" />
  
  <!-- Labels: K bottom-left, L bottom-right, M top-left -->
  <text x="70" y="320" font-family="Arial, sans-serif" font-size="32" font-weight="bold">K</text>
  <text x="360" y="320" font-family="Arial, sans-serif" font-size="32" font-weight="bold">L</text>
  <text x="80" y="90" font-family="Arial, sans-serif" font-size="32" font-weight="bold">M</text>
</svg>
