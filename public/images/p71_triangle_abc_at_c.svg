<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Triangle ABC with right angle at A -->
  <path d="M 100 100 L 100 300 L 350 300 Z" fill="#e0f2fe" stroke="black" stroke-width="3" />
  
  <!-- Right angle square at A (bottom-left) -->
  <rect x="100" y="270" width="30" height="30" fill="none" stroke="black" stroke-width="2" />
  
  <!-- Labels: A bottom-left, B bottom-right, C top-left -->
  <text x="70" y="320" font-family="Arial, sans-serif" font-size="32" font-weight="bold">A</text>
  <text x="360" y="320" font-family="Arial, sans-serif" font-size="32" font-weight="bold">B</text>
  <text x="80" y="90" font-family="Arial, sans-serif" font-size="32" font-weight="bold">C</text>
</svg>
