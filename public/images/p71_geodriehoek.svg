<svg width="600" height="350" viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Geodriehoek Body -->
  <path d="M 50 300 L 300 50 L 550 300 Z" fill="rgba(255, 255, 255, 0.5)" stroke="#999" stroke-width="2" />
  
  <!-- Scale Markings (Bottom) -->
  <line x1="50" y1="300" x2="550" y2="300" stroke="black" stroke-width="2" />
  <line x1="300" y1="300" x2="300" y2="280" stroke="black" stroke-width="3" /> <!-- 0 -->
  <text x="295" y="325" font-family="Arial" font-size="16">0</text>
  
  <line x1="175" y1="300" x2="175" y2="290" stroke="black" stroke-width="1" />
  <line x1="425" y1="300" x2="425" y2="290" stroke="black" stroke-width="1" />
  
  <!-- Protractor part -->
  <path d="M 150 300 A 150 150 0 0 1 450 300" fill="none" stroke="#fbbf24" stroke-width="8" opacity="0.6" />
  
  <!-- Right angle marking -->
  <rect x="290" y="270" width="20" height="20" fill="none" stroke="red" stroke-width="2" />
  
  <text x="270" y="40" font-family="Arial" font-size="20" font-weight="bold" fill="#333">90°</text>
</svg>
