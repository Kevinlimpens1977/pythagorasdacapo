<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="400" fill="#ffffff" rx="16"/>
  
  <!-- Triangle ABC (Blue) - Right angle at top C -->
  <g transform="translate(50, 80)">
    <path d="M 0 200 L 200 200 L 100 0 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" filter="url(#subtleShadow)"/>
    <text x="-20" y="230" font-family="Outfit, sans-serif" font-weight="bold" font-size="28" fill="#1e40af">A</text>
    <text x="210" y="230" font-family="Outfit, sans-serif" font-weight="bold" font-size="28" fill="#1e40af">B</text>
    <text x="100" y="-15" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="bold" font-size="28" fill="#1e40af">C</text>
    <text x="100" y="265" text-anchor="middle" font-family="Outfit" font-size="16" font-weight="500" fill="#94a3b8">Δ ABC</text>
  </g>

  <!-- Triangle DEF (Green) - Right angle at bottom-right E -->
  <g transform="translate(300, 80)">
    <path d="M 0 200 L 200 200 L 200 0 Z" fill="#ecfdf5" stroke="#059669" stroke-width="3" stroke-linejoin="round" filter="url(#subtleShadow)"/>
    <!-- Right angle at E -->
    <rect x="180" y="180" width="20" height="20" fill="none" stroke="#059669" stroke-width="2" opacity="0.6"/>
    <text x="-20" y="230" font-family="Outfit, sans-serif" font-weight="bold" font-size="28" fill="#065f46">D</text>
    <text x="215" y="230" font-family="Outfit, sans-serif" font-weight="bold" font-size="28" fill="#065f46">E</text>
    <text x="215" y="-10" font-family="Outfit, sans-serif" font-weight="bold" font-size="28" fill="#065f46">F</text>
    <text x="100" y="265" text-anchor="middle" font-family="Outfit" font-size="16" font-weight="500" fill="#94a3b8">Δ DEF</text>
  </g>

  <!-- Triangle KLM (Orange) - Right angle at top-left M -->
  <g transform="translate(560, 80)">
    <path d="M 0 200 L 200 200 L 0 0 Z" fill="#fffbeb" stroke="#d97706" stroke-width="3" stroke-linejoin="round" filter="url(#subtleShadow)"/>
    <!-- Right angle at M -->
    <rect x="0" y="0" width="20" height="20" fill="none" stroke="#d97706" stroke-width="2" opacity="0.6"/>
    <text x="-20" y="230" font-family="Outfit, sans-serif" font-weight="bold" font-size="28" fill="#92400e">K</text>
    <text x="215" y="230" font-family="Outfit, sans-serif" font-weight="bold" font-size="28" fill="#92400e">L</text>
    <text x="-20" y="-15" font-family="Outfit, sans-serif" font-weight="bold" font-size="28" fill="#92400e">M</text>
    <text x="100" y="265" text-anchor="middle" font-family="Outfit" font-size="16" font-weight="500" fill="#94a3b8">Δ KLM</text>
  </g>

  <!-- Triangle PQR (Pink) - Right angle at bottom-left P -->
  <g transform="translate(810, 80)">
    <path d="M 0 200 L 160 200 L 0 0 Z" fill="#fdf2f8" stroke="#db2777" stroke-width="3" stroke-linejoin="round" filter="url(#subtleShadow)"/>
    <!-- Right angle at P -->
    <rect x="0" y="180" width="20" height="20" fill="none" stroke="#db2777" stroke-width="2" opacity="0.6"/>
    <text x="-25" y="230" font-family="Outfit, sans-serif" font-weight="bold" font-size="28" fill="#9d174d">P</text>
    <text x="175" y="230" font-family="Outfit, sans-serif" font-weight="bold" font-size="28" fill="#9d174d">Q</text>
    <text x="-25" y="-15" font-family="Outfit, sans-serif" font-weight="bold" font-size="28" fill="#9d174d">R</text>
    <text x="80" y="265" text-anchor="middle" font-family="Outfit" font-size="16" font-weight="500" fill="#94a3b8">Δ PQR</text>
  </g>
</svg>
