<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="300" fill="#f8fafc" rx="20"/>
  
  <!-- Triangle ABC -->
  <g transform="translate(50, 50)">
    <path d="M 0 200 L 200 200 L 0 0 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <rect x="0" y="185" width="15" height="15" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="-15" y="215" font-family="Inter" font-weight="bold" font-size="24">A</text>
    <text x="210" y="215" font-family="Inter" font-weight="bold" font-size="24">B</text>
    <text x="-15" y="-5" font-family="Inter" font-weight="bold" font-size="24">C</text>
    <text x="100" y="240" text-anchor="middle" font-family="Inter" font-size="18" fill="#64748b">Opgave 1</text>
  </g>

  <!-- Triangle PQR -->
  <g transform="translate(350, 50)">
    <path d="M 0 0 L 200 200 L 0 200 Z" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <rect x="0" y="185" width="15" height="15" fill="none" stroke="#ea580c" stroke-width="2"/>
    <text x="-15" y="-5" font-family="Inter" font-weight="bold" font-size="24">R</text>
    <text x="-15" y="215" font-family="Inter" font-weight="bold" font-size="24">P</text>
    <text x="210" y="215" font-family="Inter" font-weight="bold" font-size="24">Q</text>
    <text x="100" y="240" text-anchor="middle" font-family="Inter" font-size="18" fill="#64748b">Opgave 2</text>
  </g>
</svg>
