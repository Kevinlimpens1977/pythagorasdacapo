<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- House Base -->
  <rect x="300" y="200" width="400" height="150" fill="#cc7a00" stroke="black" stroke-width="2" />
  <rect x="450" y="250" width="100" height="100" fill="#fff" stroke="black" stroke-width="2" /> <!-- Door/Window -->
  
  <!-- Roof (Triangle PQR) -->
  <path d="M 300 200 L 500 50 L 700 200 Z" fill="#991b1b" stroke="black" stroke-width="3" />
  <rect x="490" y="50" width="20" height="20" fill="none" stroke="white" stroke-width="2" transform="rotate(45 500 50)" /> <!-- Right angle at R -->
  
  <text x="280" y="220" font-family="Arial" font-size="24" font-weight="bold">P</text>
  <text x="710" y="220" font-family="Arial" font-size="24" font-weight="bold">Q</text>
  <text x="490" y="40" font-family="Arial" font-size="24" font-weight="bold">R</text>

  <!-- Triangle KLM (Separate diagram on the left as in the book) -->
  <path d="M 50 300 L 50 100 L 250 100 Z" fill="#e0f2fe" stroke="black" stroke-width="2" />
  <rect x="50" y="100" width="25" height="25" fill="none" stroke="black" stroke-width="1.5" />
  <text x="40" y="330" font-family="Arial" font-size="24" font-weight="bold">K</text>
  <text x="30" y="90" font-family="Arial" font-size="24" font-weight="bold">M</text>
  <text x="260" y="90" font-family="Arial" font-size="24" font-weight="bold">L</text>
</svg>
