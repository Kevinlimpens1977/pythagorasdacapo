<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background triangle with shadow -->
  <path d="M20 20 L20 80 L80 80 Z" fill="url(#logoGradient)" stroke="#1e40af" stroke-width="2" stroke-linejoin="round" filter="url(#shadow)"/>
  <!-- Right angle indicator -->
  <path d="M20 70 L30 70 L30 80" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Decorative hypotenuse highlight -->
  <path d="M22 23 L77 78" fill="none" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
</svg>
