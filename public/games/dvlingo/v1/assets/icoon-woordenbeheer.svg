<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
<!--
  Digitale Vaardigheden Lingo — assets/icoon-woordenbeheer.svg

  Het icoontje op de knop naar Woordenbeheer: een lijst met woorden en een plus
  erbij. Het wordt als masker gebruikt, dus alleen de vorm telt; de kleur komt
  uit de CSS. Daarom staat alles in één effen vlak.

  Bewust grof getekend: op de knop is dit maar 13 tot 18px groot. Een eerdere
  versie had drie dunne regels en een klein plusje en werd op ware grootte een
  witte veeg. Nu twee dikke regels en een plus die bijna de halve hoogte beslaat,
  met een uitsparing eromheen zodat de twee vormen niet aan elkaar plakken.
-->
<g fill="#000">
  <!-- Het blad, met een hap eruit waar de plus overheen komt -->
  <path d="M8 4h20a3 3 0 0 1 3 3v8.9a14.6 14.6 0 0 0-6.4 3.1H13.5v4.4h9.2a14.6 14.6 0 0 0-1.1 4.4H13.5v4.4h7.8a14.6 14.6 0 0 0 2.4 5.8H8a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3zm5.5 6.6V15h13.4v-4.4z"/>
  <!-- De plus -->
  <path d="M33.2 19a11.9 11.9 0 1 1 0 23.8 11.9 11.9 0 0 1 0-23.8zm-2.4 5.6v3.9h-3.9v4.8h3.9v3.9h4.8v-3.9h3.9v-4.8h-3.9v-3.9z"/>
</g>
</svg>
